services:
  irodori-tts:
    build: .
    image: irodori-tts:v4
    container_name: Irodori-TTS
    restart: unless-stopped
    command: ["gradio_app.py", "--server-name", "0.0.0.0", "--server-port", "7860"]
    environment:
      IRODORI_MODEL_PRECISION: "fp32"
      # RTX 2080 の8GB VRAMを合成モデルに割り当てるため。
      IRODORI_CODEC_DEVICE: "cpu"
      IRODORI_CODEC_PRECISION: "fp32"
    ports:
      - "7860:7860"
    volumes:
      - ./pretrained_models:/app/pretrained_models
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./api_outputs/irodori-tts:/app/api_outputs
      - ./reference_audio:/app/reference_audio:ro
    networks:
      dify_net:
        aliases:
          - irodori-tts-500m
          - irodori-tts-voicedesign
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/api/v1/health', timeout=2).read()\" || exit 1"]
      interval: 1m
      timeout: 5s
      start_period: 15m

networks:
  dify_net:
    external: true
    name: dify_default
